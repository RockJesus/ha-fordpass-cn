refresh_status:
  name: 刷新车辆状态
  description: 立即向福特服务器拉取该 VIN 车辆的最新状态（所有实体随之更新）。
  fields:
    vin:
      name: VIN
      description: 车辆识别码（VIN）。留空则刷新该账户下所有已配置车辆。
      required: false
      example: "LSVA1234567890ABC"
      selector:
        text:
          type: text

clear_tokens:
  name: 清除缓存令牌
  description: 清除集成缓存的 access_token 与 refresh_token。当提示令牌失效时使用，之后需在配置中重新填入 refresh_token。
  fields: {}
