# 服务层（v5.1.7，借鉴 itchannel refresh_status / marq24 clear_tokens）
# 自动化可直接调用；对齐 HA 官方 services.yaml 规范（name/description/fields/selector）。

refresh_status:
  name: 刷新车辆状态
  description: 立即向福特云端请求刷新车辆状态（可选指定 VIN；缺省刷新账号下全部车辆）。注意云端刷新为命令式，响应时效约 30-60 秒。
  fields:
    vin:
      name: VIN
      description: 车辆识别码（17 位）。缺省时刷新账号下全部车辆；指定时仅刷新该车。
      required: false
      example: "LVSHFAKE000000001"
      selector:
        text:
          type: text

clear_tokens:
  name: 清除令牌
  description: 清除已保存的访问令牌并重置 API 会话。下次重新加载集成时需重新认证（登录方式与手机号不变）。用于登录异常、令牌疑似失效时重置。
  fields: {}

# ---- v5.8.2 未接入端点补全服务（share_wallbox / create_departure /
# update_srs / approve_auth）——按钮为无参快捷方式，服务为自动化带参入口

share_wallbox:
  name: 分享家充桩
  description: 把家充桩分享给家人（需目标手机号）。wallbox_id 缺省时自动取默认绑定桩。属于写入操作，请在福特派 App 中核对后使用。
  fields:
    phone:
      name: 目标手机号
      description: 被分享家人的手机号（必填）。
      required: true
      example: "138****0000"
      selector:
        text:
          type: text
    vin:
      name: VIN
      description: 车辆识别码（可选；缺省作用于账号下第一辆车）。
      required: false
      example: "LVSHFAKE000000001"
      selector:
        text:
          type: text
    wallbox_id:
      name: 家充桩 ID
      description: 家充桩标识（可选；缺省自动取默认绑定桩）。
      required: false
      selector:
        text:
          type: text

create_departure:
  name: 保存预约出发/充电计划
  description: 保存/新建预约出发充电计划。structure 缺省时按云端现有计划结构回填（App 复制计划语义）；字段名与福特派 App 创建计划页一致。
  fields:
    vin:
      name: VIN
      description: 车辆识别码（可选；缺省作用于账号下第一辆车）。
      required: false
      example: "LVSHFAKE000000001"
      selector:
        text:
          type: text
    structure:
      name: 计划结构
      description: 预约计划完整结构（可选；缺省复制云端现有计划）。
      required: false
      selector:
        object:

update_srs:
  name: 保存紧急联系人
  description: 保存/更新 SRS 紧急联系人档案（档案结构来自云端现有档案，无需手工传参）。
  fields:
    vin:
      name: VIN
      description: 车辆识别码（可选；缺省作用于账号下第一辆车）。
      required: false
      example: "LVSHFAKE000000001"
      selector:
        text:
          type: text

approve_auth:
  name: 车辆授权审批
  description: 同意/拒绝他人申请授权你的车（审批对象取云端待审批申请，无需手工传参）。
  fields:
    approve:
      name: 是否同意
      description: true=同意授权，false=拒绝授权（默认同意）。
      required: false
      default: true
      selector:
        boolean:
    vin:
      name: VIN
      description: 车辆识别码（可选；缺省作用于账号下第一辆车）。
      required: false
      example: "LVSHFAKE000000001"
      selector:
        text:
          type: text
